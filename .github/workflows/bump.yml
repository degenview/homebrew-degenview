name: Bump

# Rewrites the casks from the app's GitHub releases and opens a pull request when they changed. It
# pulls: nothing in degenview/degenview holds a token for this repo. Every six hours, and by hand.
#
# Two jobs, so the code that downloads and verifies files never holds a token that can write here:
#   fetch    read-only  scripts/bump.sh chooses the releases, verifies and hashes the zips
#   propose  write      commits the casks to the `bump` branch and opens the pull request
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false

env:
  SOURCE_REPO: degenview/degenview

jobs:
  fetch:
    name: Choose and verify releases
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Write the casks
        run: scripts/bump.sh
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: casks
          path: Casks
          retention-days: 1
          if-no-files-found: error

  propose:
    name: Open the pull request
    needs: fetch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: casks
          path: Casks

      - name: Commit, push and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- Casks)" ]; then
            echo "The casks already match the releases."
            exit 0
          fi
          versions="$(grep -h '^  version ' Casks/*.rb | sort -u | sed 's/^  version //' | paste -sd' ' -)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bump
          git add Casks
          git commit -m "Casks: ${versions}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" bump
          if [ -z "$(gh pr list --head bump --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head bump --base main --title "Casks: ${versions}" \
              --body "Written by \`scripts/bump.sh\` from the releases of degenview/degenview, after \`gh release verify\`, \`verify-asset\` and \`gh attestation verify\`."
          fi
          # A pull request opened with this token starts no workflows; run the required check on the branch.
          gh workflow run ci.yml --ref bump
